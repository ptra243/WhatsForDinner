name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  database:
    name: database
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Apply migrations to a local Supabase database
        run: supabase db start
      - name: Lint SQL functions
        run: supabase db lint --local --level error --fail-on error
      - name: Structural checks
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/checks.sql
      - name: Seed is up to date with seed/
        run: |
          node supabase/seed/build.mjs
          git diff --exit-code supabase/seed/seed.sql
      - name: Seed loads once and keeps household edits
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 $(node supabase/tests/seed-counts.mjs) -f supabase/tests/seed.sql
      - name: New households get their own copy of the examples
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 $(node supabase/tests/seed-counts.mjs) -f supabase/tests/households.sql
      - name: Moving a night's dinner swaps whole nights
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/move_night.sql
      - name: Dinner Planner skill SQL examples run
        run: node supabase/tests/skill-sql.mjs | psql "$DB_URL" -v ON_ERROR_STOP=1

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Apply migrations to a local Supabase database
        run: npx supabase db start --workdir ..
      - name: Database types are up to date with the migrations
        run: |
          npm run gen:types
          git diff --exit-code src/lib/database.types.ts
